<main class="admin-page" style="max-width:450px"><h1>Wedding administration</h1><p>Sign in with your authorized administrator account.</p>
<form class="panel" (ngSubmit)="submit()"><label for="email">Email<input id="email" name="email" type="email" autocomplete="username" [(ngModel)]="email" required [disabled]="busy()"></label>
<label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" required [disabled]="busy()"></label>
@if (error()) {<p class="error" role="alert">{{error()}}</p>}<button type="submit" [disabled]="busy()">{{busy() ? 'Signing in…' : 'Sign in'}}</button></form></main>
