@if (timeLeft().days || timeLeft().hours || timeLeft().minutes || timeLeft().seconds) {
  <div class="countdown" aria-label="Time until our wedding day">
    @for (unit of units; track unit.label) {
      <div class="countdown-unit">
        <span class="countdown-value">{{ unit.value.toString().padStart(2, '0') }}</span>
        <span class="countdown-label">{{ unit.label }}</span>
      </div>
    }
  </div>
} @else {
  <p class="celebration-message">{{ celebrationMessage() }}</p>
}
