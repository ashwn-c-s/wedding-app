<nav class="sticky top-0 z-50 bg-cream ">
  <div class="max-w-6xl mx-auto px-6 md:px-12 py-4 flex items-center justify-end">
    <!-- Desktop links -->
    <div class="hidden md:flex gap-8">
      <a [routerLink]="token ? ['/invite', token] : ['/']" routerLinkActive="text-terracotta" [routerLinkActiveOptions]="{exact: true}" class="text-sm tracking-wide text-forest hover:text-terracotta transition-colors">Home</a>
      @if (token) {
      <a [routerLink]="['/invite', token, 'rsvp']" routerLinkActive="text-terracotta" class="text-sm tracking-wide text-forest hover:text-terracotta transition-colors">RSVP</a>
      }
      <a [routerLink]="token ? ['/invite', token, 'venues'] : ['/venues']" routerLinkActive="text-terracotta" class="text-sm tracking-wide text-forest hover:text-terracotta transition-colors">Venues</a>
      <a [routerLink]="token ? ['/invite', token, 'about'] : ['/about']" routerLinkActive="text-terracotta" class="text-sm tracking-wide text-forest hover:text-terracotta transition-colors">About us</a>
      <a [routerLink]="token ? ['/invite', token, 'gallery'] : ['/gallery']" routerLinkActive="text-terracotta" class="text-sm tracking-wide text-forest hover:text-terracotta transition-colors">Gallery</a>
    </div>

    <!-- Hamburger (mobile only) -->
    <button type="button" aria-label="Toggle navigation" [attr.aria-expanded]="mobileMenuOpen()" (click)="toggleMenu()" class="md:hidden text-forest">
      <span class="material-icons text-2xl">
        {{ mobileMenuOpen() ? 'close' : 'menu' }}
      </span>
    </button>

  </div>

  <!-- Mobile overlay menu -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden flex flex-col items-center gap-6 py-8 bg-cream border-t border-forest/15">
      <a [routerLink]="token ? ['/invite', token] : ['/']" (click)="closeMenu()" class="text-base text-forest">Home</a>
      @if (token) {
      <a [routerLink]="['/invite', token, 'rsvp']" (click)="closeMenu()" class="text-base text-forest">RSVP</a>
      }
      <a [routerLink]="token ? ['/invite', token, 'venues'] : ['/venues']" (click)="closeMenu()" class="text-base text-forest">Venues</a>
      <a [routerLink]="token ? ['/invite', token, 'about'] : ['/about']" (click)="closeMenu()" class="text-base text-forest">About us</a>
      <a [routerLink]="token ? ['/invite', token, 'gallery'] : ['/gallery']" (click)="closeMenu()" class="text-base text-forest">Gallery</a>
    </div>
  }
</nav>
